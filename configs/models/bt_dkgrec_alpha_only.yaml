# Tach bien: CHI loai hanh vi (alpha), BO suy giam thoi gian (lambda = 0).
#
# Giong het bt_dkgrec_l05 o MOI tham so, tru mot dong: lambda_decay 0,05 -> 0.
# Cung voi bt_dkgrec_time_only, cap nay tra loi cau hoi hoi dong:
#   "phan tang cua BT-DKGRec so voi Static KG den tu alpha hay tu lambda?"
#
#   static_kg_gcn          alpha 1/1/1   lambda 0      (khong co ca hai)
#   bt_dkgrec_alpha_only   alpha 1/2/3   lambda 0      <- file nay
#   bt_dkgrec_time_only    alpha 1/1/1   lambda 0,05
#   bt_dkgrec_l05          alpha 1/2/3   lambda 0,05   (mo hinh de xuat)
#
# Voi lambda = 0, exp(-lambda * delta) = 1 nen trong so canh chi con alpha_b.
# Xem docs/DECISIONS.md muc D35.
model:
  name: bt_dkgrec_alpha_only
  kind: gcn
  use_side_info: true
  trainable: true
  embedding_dim: 64
  num_layers: 3

weighting:
  lambda_decay: 0.0
