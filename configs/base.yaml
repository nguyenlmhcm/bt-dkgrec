# Cấu hình nền — mọi run kế thừa file này.
# Thứ tự hợp nhất: base.yaml <- configs/data/<cohort>.yaml <- configs/models/<model>.yaml <- CLI override
# Mọi khoá đều bắt buộc và được pydantic validate (extra="forbid": sai tên khoá là lỗi, không im lặng).

project:
  name: bt-dkgrec-gcn
  thesis: "Xay dung ung dung du bao hanh vi khach hang su dung do thi tri thuc dong"

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  runs: experiments/runs

data:
  events_file: events.csv
  item_properties_files:
    - item_properties_part1.csv
    - item_properties_part2.csv
  category_tree_file: category_tree.csv
  # Doc CSV theo chunk — VPS chi co 3 GB RAM, item_properties co 20,3 trieu dong.
  chunksize: 1000000
  # Hanh vi dung lam tin hieu lich su (canh tuong tac trong graph train).
  history_behaviors: [view, addtocart, transaction]
  # Hanh vi muc tieu dinh nghia ground truth o valid/test.
  target_behaviors: [addtocart, transaction]
  split:
    # "time_span": cat theo phan vi cua KHOANG THOI GIAN, khong phai theo so su kien.
    # Da kiem chung: T_train = t_min + int(0.7*(t_max-t_min)) cho dung 2.024.042 train events
    # bang Bang 4.2 cua luan van v11 (lech 0). Xem docs/DECISIONS.md muc D1.
    mode: time_span
    train_ratio: 0.7
    valid_ratio: 0.1
    test_ratio: 0.2
    boundary_inclusive: true    # su kien co ts == T_train thuoc ve train

graph:
  # Loc PropertyValue: freq >= min_pv_freq TRUOC, roi lay top max_property_nodes theo tan suat.
  min_pv_freq: 5
  # LUU Y TEN GOI: luan van v11 (Bang 4.4) goi tham so nay la "max_property_edges",
  # nhung ngu nghia thuc te la SO NODE PropertyValue duoc giu lai, khong phai so canh.
  # Doi ten trong code cho dung ban chat; anh xa ten cu ghi tai docs/DECISIONS.md muc D3.
  max_property_nodes: 50000
  # Bo hai property nay khi dung node PropertyValue (KG_DESIGN.md muc 2.4):
  #   categoryid -> dung de tao canh HAS_CATEGORY
  #   available  -> tin hieu ton kho, khong phai tri thuc san pham
  drop_properties: [categoryid, available]
  rel_weight_item_category: 1.0
  rel_weight_item_property: 1.0
  rel_weight_category_parent: 1.0

weighting:
  # Tham so cua cong thuc (3.16)-(3.18). CHI la tham so;
  # viec mo hinh nao AP DUNG cong thuc nay do lop model quyet dinh (edge_weight()),
  # khong bao gio do mot cong tac trong config. Xem docs/DECISIONS.md muc D4.
  alpha:
    view: 1.0
    addtocart: 2.0
    transaction: 3.0
  lambda_decay: 0.01
  d_day: 86400000     # ms/ngay — timestamp RetailRocket dung mili giay

training:
  loss: bpr                 # bpr | weighted_bpr (weighted_bpr CHI dung trong ablation)
  num_negatives: 1
  batch_size: 65536
  learning_rate: 0.005
  reg_weight: 0.0001
  max_epochs: 1000          # cap chung cho MOI mo hinh — early stopping quyet dinh diem dung
  eval_every: 5             # danh gia valid moi 5 epoch
  patience: 20              # so lan eval khong cai thien truoc khi dung
  monitor: ndcg@20          # chi doc valid — khong bao gio doc test
  monitor_mode: max
  device: cuda              # Colab; VPS smoke test dat cpu qua CLI override

evaluation:
  # So user cham diem moi lo. Chi phi lon nhat la mang chi so int64 cua
  # argpartition: batch x n_item x 8 byte. Voi n_item = 205.106:
  #   batch 256 -> ~840 MB (da lam OOM), batch 64 -> ~160 MB, batch 16 -> ~40 MB.
  # VPS nay thuc te chi con ~350 MB kha dung nen dung 16. Tang len tren Colab.
  batch_size: 16
  k_values: [10, 20]
  primary_k: 20
  filter_seen: true             # loai item da tuong tac trong train khoi Top-K
  candidate_scope: train_items  # candidate set = I_train (quy tac chong ro ri so 5)
  # Coverage@K: tu so = so item PHAN BIET xuat hien trong Top-K cua TOAN BO user duoc danh gia;
  #             mau so = |I_train|.
  coverage_denominator: train_items
  segments: [warm, cold, all]

seed: 2020   # bi ghi de boi CLI --seed; bo seed chinh thuc nam o experiments/seeds.json
